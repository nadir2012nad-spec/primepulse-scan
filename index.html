<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PrimePulse OPS — Scan Router</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--c:#00f0ff;--g:#00ff88;--p:#a855f7;--bg:#030810;--txt:#b8d4e0;--txt2:#4a6a7a;--border:rgba(0,240,255,.18)}*{box-sizing:border-box;margin:0;padding:0}body{background:#030810;color:var(--txt);font-family:Syne,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(0,240,255,.08),transparent),linear-gradient(rgba(0,240,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.025) 1px,transparent 1px);background-size:auto,50px 50px,50px 50px;pointer-events:none}.box{position:relative;z-index:1;width:min(780px,100%);background:linear-gradient(135deg,rgba(0,240,255,.06),rgba(168,85,247,.04));border:1px solid rgba(0,240,255,.32);border-radius:22px;padding:34px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.brand{font-family:'JetBrains Mono',monospace;color:var(--c);letter-spacing:3px;font-size:12px;font-weight:700;margin-bottom:16px}h1{color:#fff;font-size:34px;line-height:1.08;margin-bottom:10px}p{line-height:1.7;color:rgba(184,212,224,.75);margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin:24px 0}@media(max-width:640px){.grid{grid-template-columns:1fr}.box{padding:24px}h1{font-size:26px}}label{font-family:'JetBrains Mono',monospace;color:var(--txt2);font-size:10px;letter-spacing:2px;text-transform:uppercase}select,input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);color:#fff;padding:14px;border-radius:10px;font-family:'JetBrains Mono',monospace;outline:none}button,a.btn{display:inline-flex;text-decoration:none;align-items:center;justify-content:center;border:1px solid rgba(0,240,255,.42);background:rgba(0,240,255,.08);color:var(--c);padding:14px 18px;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;cursor:pointer}.out{margin-top:16px;padding:14px;border:1px solid var(--border);background:rgba(0,0,0,.25);border-radius:10px;word-break:break-all;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--g);display:none}.note{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--txt2);margin-top:18px}
</style>
</head>
<body>
<div class="box"><div class="brand">PRIMEPULSE OPS :: SCAN ROUTER</div><h1>Generate a permanent live token scan.</h1><p>Paste the contract detected by your bot, select the chain, then copy the generated URL. Each contract gets its own dynamic scan page.</p><div class="grid"><div><label>Chain</label><select id="chain"><option value="solana">Solana</option><option value="base">Base</option><option value="bsc">BNB Chain</option><option value="ethereum">Ethereum</option></select></div><div><label>Contract</label><input id="contract" placeholder="Paste token contract..." /></div></div><button onclick="makeLink()">GENERATE SCAN LINK →</button><div class="out" id="out"></div><div class="note">URL format: /scan/{chain}/{contract}</div></div>
<script>function makeLink(){const chain=document.getElementById('chain').value.trim();const contract=document.getElementById('contract').value.trim();const out=document.getElementById('out');if(!contract){out.style.display='block';out.textContent='Paste a contract first.';return;}const url=location.origin+'/scan/'+encodeURIComponent(chain)+'/'+encodeURIComponent(contract);out.style.display='block';out.innerHTML='<a class="btn" href="'+url+'" target="_blank">OPEN SCAN</a><br><br>'+url;navigator.clipboard?.writeText(url);}</script>
</body>
</html>
